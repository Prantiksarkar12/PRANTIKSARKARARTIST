<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f0914" />
      <stop offset="100%" stop-color="#070709" />
    </radialGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Outer Sound Pulse Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(225,29,72,0.12)" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(225,29,72,0.2)" stroke-width="1.5" />

  <!-- Center Vinyl / Sonic Core -->
  <circle cx="256" cy="256" r="130" fill="#0d0d14" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <circle cx="256" cy="256" r="105" fill="#12121c" />

  <!-- Sound Equalizer Bars Behind -->
  <g opacity="0.35" transform="translate(196, 216)">
    <rect x="0" y="30" width="8" height="40" rx="4" fill="url(#roseGrad)" />
    <rect x="16" y="15" width="8" height="70" rx="4" fill="url(#roseGrad)" />
    <rect x="32" y="0" width="8" height="100" rx="4" fill="url(#roseGrad)" />
    <rect x="48" y="20" width="8" height="60" rx="4" fill="url(#roseGrad)" />
    <rect x="64" y="5" width="8" height="90" rx="4" fill="url(#roseGrad)" />
    <rect x="80" y="25" width="8" height="50" rx="4" fill="url(#roseGrad)" />
    <rect x="96" y="38" width="8" height="24" rx="4" fill="url(#roseGrad)" />
    <rect x="112" y="42" width="8" height="16" rx="4" fill="url(#roseGrad)" />
  </g>

  <!-- Stylized Monogram "PS" -->
  <g filter="url(#glow)">
    <!-- Letter P -->
    <path d="M 176 168 L 176 344 M 176 168 L 226 168 C 254 168 266 182 266 210 C 266 238 254 252 226 252 L 176 252" 
          fill="none" 
          stroke="url(#roseGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Letter S -->
    <path d="M 334 196 C 322 176 302 168 280 168 C 252 168 238 184 238 206 C 238 248 336 232 336 294 C 336 332 306 344 274 344 C 246 344 228 330 220 310" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Accent Gem -->
  <circle cx="256" cy="382" r="4" fill="url(#goldGrad)" filter="url(#glow)" />
</svg>
